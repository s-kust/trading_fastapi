<html>
<head>
    <title>RSI Chart</title>
</head>
<body>
    <h1>Ticker: {{ ticker }}</h1>
    <img src="/static/images/{{ ticker }}_RSI.png" alt="{{ ticker }} RSI" width="700" height="800" />
    <p style="text-align: center">next_day_threshold_price: {{ next_day_threshold_price }}</p>
    <p style="text-align: center">rsi_threshold: {{ rsi_threshold }}</p>
    <p style="text-align: center">calculated_rsi_val: {{ calculated_rsi_val }}</p>
    <p style="text-align: center">msg: {{ msg }}</p>
    <p style="text-align: center"><a href="/rsi_update/{{ ticker }}">Update chart</a></p>
    <p style="text-align: center"><a href="/">Return to the main page</a></p>
</body>
</html>
