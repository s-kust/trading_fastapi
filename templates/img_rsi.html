<html>
<head>
    <title>RSI Chart</title>
</head>
<body>
    <h1>Ticker: {{ ticker }}</h1>
    <img src="/static/images/{{ ticker }}_RSI.png" alt="{{ ticker }} RSI" width="700" height="800" />
    <p>next_day_threshold_price: {{ next_day_threshold_price }}</p>
    <p>rsi_threshold: {{ rsi_threshold }}</p>
    <p>calculated_rsi_val: {{ calculated_rsi_val }}</p>
    <p>msg: {{ msg }}</p>
    <p><a href="/rsi_update/{{ ticker }}">Update chart</a></p>
    <p><a href="/">Return to the main page</a></p>
</body>
</html>
